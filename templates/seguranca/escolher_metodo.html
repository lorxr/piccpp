<!doctype html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Escolher Método - Alvormed.AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="corpo-login">
    
    <div class="container-clean">
        <h2>Onde devemos enviar o código?</h2>
        <p class="texto-instrucao">
            Encontramos estes contatos vinculados ao seu usuário. Escolha uma opção:
        </p>

        <form action="/enviar-codigo" method="POST">
            
            <div class="form-group" style="text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #e2e8f0;">
                <label style="cursor: pointer; display: flex; align-items: center; font-weight: normal; margin: 0;">
                    <input type="radio" name="metodo" value="email" required style="margin-right: 12px; transform: scale(1.3);">
                    <div>
                        <strong style="display: block; color: #333; font-size: 15px;">E-mail</strong>
                        <span style="font-size: 14px; color: #666;">{{ email }}</span>
                    </div>
                </label>
            </div>

            <div class="form-group" style="text-align: left; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 24px; border: 1px solid #e2e8f0;">
                <label style="cursor: pointer; display: flex; align-items: center; font-weight: normal; margin: 0;">
                    <input type="radio" name="metodo" value="sms" required style="margin-right: 12px; transform: scale(1.3);">
                    <div>
                        <strong style="display: block; color: #333; font-size: 15px;">SMS (Telefone)</strong>
                        <span style="font-size: 14px; color: #666;">{{ sms }}</span>
                    </div>
                </label>
            </div>

            <button type="submit" class="btn-success">Enviar Código</button>
        </form>

        <br>
        <a href="/login" class="link-cancelar">Cancelar e voltar</a>
    </div>

</body>
</html>
