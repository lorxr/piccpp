<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Esqueci Minha Senha - Alvormed.AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="corpo-login">
    
    <div class="container-clean">
        <h2>Recuperar Senha</h2>
        <p class="texto-instrucao">
            Informe o seu usuário para enviarmos as opções de recuperação.
        </p>

        {% if erro %}
            <div class="alerta-erro">
                {{ erro }}
            </div>
        {% endif %}

        <form action="/esqueci-senha" method="POST">
            <div class="form-group" style="text-align: left;">
                <label for="usuarioRecuperar">Usuário</label>
                <input type="text" id="usuarioRecuperar" name="usuarioRecuperar" class="input-clean" placeholder="Digite seu usuário" required autocomplete="off">
            </div>

            <button type="submit" class="btn-success">Avançar</button>
        </form>

        <br>
        <a href="/login" class="link-cancelar">Voltar ao login</a>
    </div>

</body>
</html>
